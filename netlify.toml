[build]
  publish = "."
  # Génère /blog depuis content/blog/*.md et copie l'éditeur dans /admin/cms.
  command = "npm run build"

[functions]
  directory = "netlify/functions"

# Keep one canonical URL for every service page.
[[redirects]]
  from = "/photography"
  to = "/photography.html"
  status = 301
  force = true

[[redirects]]
  from = "/video-production"
  to = "/video-production.html"
  status = 301
  force = true

[[redirects]]
  from = "/live-streaming"
  to = "/live-streaming.html"
  status = 301
  force = true

[[redirects]]
  from = "/graphic-design"
  to = "/graphic-design.html"
  status = 301
  force = true

[[redirects]]
  from = "/podcast-production"
  to = "/podcast-production.html"
  status = 301
  force = true

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = """default-src 'self';
  script-src 'self' 'unsafe-inline'
    https://www.googletagmanager.com
    https://www.clarity.ms
    https://cdn.clarity.ms
    https://calendly.com
    https://assets.calendly.com;
  style-src 'self' 'unsafe-inline'
    https://assets.calendly.com;
  frame-src
    https://www.youtube-nocookie.com
    https://www.youtube.com
    https://player.vimeo.com
    https://calendly.com
    https://open.spotify.com
    https://podcasters.spotify.com;
  img-src 'self' data: blob:
    https://www.google-analytics.com
    https://www.googletagmanager.com
    https://www.clarity.ms
    https://i.ytimg.com
    https://img.youtube.com;
  font-src 'self'
    https://assets.calendly.com;
  connect-src 'self'
    https://www.google-analytics.com
    https://analytics.google.com
    https://region1.google-analytics.com
    https://region1.analytics.google.com
    https://stats.g.doubleclick.net
    https://www.googletagmanager.com
    https://www.clarity.ms
    https://c.bing.com
    https://calendly.com
    https://open.er-api.com;
  media-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'self';
  frame-ancestors 'none'"""

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/portfolio-designs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"


# ═══ BOT TRAPS — chemins WordPress/CMS jamais présents sur ce site ═══
# Retourne 404 immédiatement sans exposer d'info

[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-content/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/phpmyadmin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/config.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/setup.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.well-known/security.txt"
  to = "/security.txt"
  status = 200

# ═══ BACK-OFFICE /admin ═══
# CSP propre au back-office : le site public garde la sienne, plus stricte.
# L'éditeur est servi depuis 'self' (copié par build-admin.js), jamais depuis un CDN.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache, must-revalidate"
    Content-Security-Policy = """default-src 'self';
  script-src 'self' 'unsafe-inline' 'unsafe-eval';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:
    https://avatars.githubusercontent.com
    https://raw.githubusercontent.com;
  font-src 'self' data:;
  connect-src 'self' blob: data:
    https://api.github.com
    https://github.com
    https://uploads.githubusercontent.com
    https://raw.githubusercontent.com
    https://avatars.githubusercontent.com;
  frame-src 'self' blob:;
  worker-src 'self' blob:;
  child-src 'self' blob:;
  media-src 'self' blob: data:;
  object-src 'none';
  base-uri 'self';
  form-action 'self';
  frame-ancestors 'none'"""

# Fichiers de l'éditeur : noms versionnés, donc cachables longtemps.
[[headers]]
  for = "/admin/cms/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Les fonctions d'authentification ne doivent jamais être mises en cache.
[[headers]]
  for = "/oauth/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
