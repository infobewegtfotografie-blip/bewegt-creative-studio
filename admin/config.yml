# Back-office BEWEGT — écrit directement dans le dépôt GitHub.
# L'authentification passe par les fonctions /oauth/auth et /oauth/callback.
backend:
  name: github
  repo: infobewegtfotografie-blip/bewegt-creative-studio
  branch: main
  base_url: https://bewegtcreative.com
  auth_endpoint: oauth/auth

locale: fr
publish_mode: simple
media_folder: img/blog
public_folder: /img/blog

collections:
  - name: posts
    label: Journal
    label_singular: Article
    folder: content/blog
    create: true
    delete: true
    extension: md
    slug: '{{slug}}'
    summary: '{{title}} — {{date}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Titre, widget: string }
      - {
          name: date,
          label: Date de publication,
          widget: datetime,
          date_format: 'YYYY-MM-DD',
          time_format: false,
          format: 'YYYY-MM-DD',
        }
      - {
          name: lang,
          label: Langue de l'article,
          widget: select,
          default: en,
          options:
            [
              { label: English, value: en },
              { label: Français, value: fr },
              { label: Deutsch, value: de },
            ],
        }
      - {
          name: group,
          label: Groupe de traduction,
          widget: string,
          required: false,
          hint: 'Même mot sur les versions FR, DE et EN d''un même article — le drapeau mènera alors à la bonne version. Laisse vide si l''article n''existe que dans une langue.',
        }
      - { name: summary, label: Résumé (liste + Google), widget: text, required: false }
      - { name: author, label: Auteur, widget: string, default: BEWEGT CREATIVE STUDIO }
      - { name: category, label: Catégorie, widget: string, required: false, hint: 'Ex. Coulisses, Photographie, Film, Conseils' }
      - { name: cover, label: Photo de couverture, widget: image, required: false }
      - { name: coverAlt, label: Description de la photo, widget: string, required: false }
      - {
          name: video,
          label: Vidéo (lien YouTube ou Vimeo),
          widget: string,
          required: false,
          hint: 'Colle l''adresse de la vidéo. Seuls YouTube et Vimeo sont acceptés.',
        }
      - { name: draft, label: Brouillon (invisible sur le site), widget: boolean, default: false }
      - {
          name: body,
          label: Article,
          widget: markdown,
          hint: 'Titres, gras, italique, liens, listes, images, emojis. — Note de source : écris [^1] dans le texte et, en fin d''article, [^1]: la référence ; la section Sources se construit toute seule. — Encart : une ligne :::encart Titre, ton texte, puis une ligne :::',
        }
      - {
          name: next,
          label: Dans le prochain article,
          widget: text,
          required: false,
          hint: 'Encadré de fin. Laisse vide s''il n''y a pas de suite annoncée.',
        }
      - name: readMore
        label: Pour aller plus loin
        label_singular: Référence
        widget: list
        required: false
        hint: 'Une ligne par ouvrage. Le gras et l''italique fonctionnent : **Auteur**, *Titre*, éditeur, année.'
        field: { name: item, label: Référence, widget: string }
      - name: gallery
        label: Galerie photo
        label_singular: Photo
        widget: list
        required: false
        summary: '{{fields.caption}}'
        fields:
          - { name: image, label: Image, widget: image }
          - { name: alt, label: Description accessible, widget: string, hint: 'Décris ce que montre la photo.' }
          - { name: caption, label: Légende, widget: string, required: false }
      - { name: localVideo, label: Fichier vidéo (MP4 ou WebM), widget: file, required: false, hint: 'Pour les gros fichiers, préfère YouTube ou Vimeo afin de garder le site rapide.' }
      - { name: videoPoster, label: Affiche de la vidéo, widget: image, required: false }
      - { name: localAudio, label: Fichier audio (MP3, M4A, OGG ou WAV), widget: file, required: false }
      - { name: mediaTitle, label: Titre du média, widget: string, required: false }
      - name: documents
        label: Documents PDF
        label_singular: PDF
        widget: list
        required: false
        summary: '{{fields.title}}'
        fields:
          - { name: title, label: Titre du document, widget: string }
          - { name: description, label: Description, widget: string, required: false }
          - { name: file, label: Fichier PDF, widget: file }
      - name: cta
        label: Appel à l'action
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: label, label: Message, widget: string, required: false, hint: 'Ex. Vous avez un projet en tête ?' }
          - { name: url, label: Lien, widget: string, required: false, hint: 'Adresse HTTPS ou lien interne commençant par /' }
      - name: comments
        label: Commentaires publiés
        widget: list
        required: false
        label_singular: Commentaire
        summary: '{{fields.name}} — {{fields.date}}'
        fields:
          - { name: name, label: Nom du lecteur, widget: string }
          - {
              name: date,
              label: Date,
              widget: datetime,
              date_format: 'YYYY-MM-DD',
              time_format: false,
              format: 'YYYY-MM-DD',
              required: false,
            }
          - { name: message, label: Commentaire, widget: text }

  - name: legal
    label: Pages légales
    label_singular: Page
    folder: content/legal
    create: false
    delete: false
    extension: md
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: eyebrow, label: Surtitre, widget: string, required: false }
      - { name: summary, label: Résumé, widget: text, required: false }
      - { name: body, label: Contenu, widget: markdown }
